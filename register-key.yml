name: Register Unlimited Key

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Telegram user ID"
        required: true
        default: "5764580381"
      plan:
        description: "Key plan"
        required: true
        default: "unlimited"

jobs:
  register-key:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      USER_ID: ${{ inputs.user_id }}
      PLAN: ${{ inputs.plan }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secret
        run: |
          test -n "$MY_GITHUB_TOKEN" || (echo "MY_GITHUB_TOKEN is missing" && exit 1)
          echo "Secret is available. Its value will not be printed."

      - name: Register key in auth_list.json
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          owner = "umoneydigger-creator"
          repo = "Minus-"
          path = "auth_list.json"
          token = os.environ["MY_GITHUB_TOKEN"]
          user_id = os.environ["USER_ID"]
          plan = os.environ["PLAN"]

          if plan != "unlimited":
              raise SystemExit("This workflow only registers unlimited keys")

          url = f"https://api.github.com/repos/{owner}/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "key-registration-workflow",
          }

          read_request = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(read_request) as response:
                  file_data = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"GitHub read failed with HTTP {error.code}")

          current_content = base64.b64decode(file_data["content"]).decode("utf-8")
          auth_list = json.loads(current_content)

          auth_list[user_id] = {
              "expires_at": "9999-12-31T23:59:59Z",
              "plan": "unlimited"
          }

          new_content = json.dumps(
              auth_list,
              ensure_ascii=False,
              indent=2
          ).encode("utf-8")

          update_body = json.dumps({
              "message": f"Add unlimited key for {user_id}",
              "content": base64.b64encode(new_content).decode("ascii"),
              "sha": file_data["sha"]
          }).encode("utf-8")

          update_headers = {
              **headers,
              "Content-Type": "application/json"
          }
          update_request = urllib.request.Request(
              url,
              data=update_body,
              headers=update_headers,
              method="PUT"
          )

          try:
              with urllib.request.urlopen(update_request) as response:
                  if response.status not in (200, 201):
                      raise SystemExit(
                          f"GitHub update failed with HTTP {response.status}"
                      )
          except urllib.error.HTTPError as error:
              raise SystemExit(f"GitHub update failed with HTTP {error.code}")

          print(f"Registered user {user_id} with plan unlimited")
          PY
